{% extends "base.html" %}
{% block title %}login - freshmanPumpAndDump{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>login</h1>
  <form method="post">
    <label>username<input name="username" autocomplete="username" autofocus></label>
    <label>password<input type="password" name="password" autocomplete="current-password"></label>
    <button>login</button>
  </form>
  <p><a href="{{ url_for('register') }}">register a new account</a></p>
</div>
{% endblock %}
