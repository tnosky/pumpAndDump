{% extends "base.html" %}
{% block title %}register - freshmanPumpAndDump{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>register</h1>
  <form method="post">
    <label>username<input name="username" autocomplete="username" autofocus></label>
    <label>password<input type="password" name="password" autocomplete="new-password"></label>
    <button>create account</button>
  </form>
  <p>your account needs moderator approval before trading.</p>
</div>
{% endblock %}
